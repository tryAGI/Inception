  "paths": {
    "/v1/decisions": {
      "post": {
        "summary": "Create a decision",
        "operationId": "createDecision",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DecisionRequest"
              },
              "example": {
                "model": "mercury-decide",
                "state": {
                  "message": "Please refund the duplicate charge on my account."
                },
                "questions": {
                  "billing": {
                    "type": "noul",
                    "instructions": "Is this request about billing?"
                  },
                  "team": {
                    "type": "choice",
                    "criteria": {
                      "billing": "Payments, charges, and refunds",
                      "support": "Technical support and other requests"
                    }
                  },
                  "urgency": {
                    "type": "score",
                    "instructions": "How urgent is this request?",
                    "criteria": [
                      "Can wait",
                      "Needs attention soon",
                      "Needs immediate attention"
                    ]
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionResponse"
                },
                "example": {
                  "model": "mercury-decide",
                  "answers": {
                    "billing": {
                      "type": "noul",
                      "noul": 0.97
                    },
                    "team": {
                      "type": "choice",
                      "choice": "billing",
                      "probabilities": {
                        "billing": 0.96,
                        "support": 0.04
                      },
                      "confidence": 0.96
                    },
                    "urgency": {
                      "type": "score",
                      "score": 1.1,
                      "legend": {
                        "0": "Can wait",
                        "1": "Needs attention soon",
                        "2": "Needs immediate attention"
                      },
                      "probabilities": {
                        "0": 0.1,
                        "1": 0.7,
                        "2": 0.2
                      },
                      "confidence": 0.7
                    }
                  },
                  "usage": {
                    "input_tokens": 120,
                    "output_tokens": 3
                  }
                }
              }
            }
          },
          "422": {
            "description": "Unprocessable Entity \u2014 invalid decision request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError422"
                },
                "examples": {
                  "validation": {
                    "summary": "Invalid request",
                    "value": {
                      "detail": [
                        {
                          "loc": [
                            "body",
                            "questions"
                          ],
                          "msg": "Field required",
                          "type": "missing"
                        }
                      ]
                    }
                  },
                  "upstream": {
                    "summary": "Service validation error",
                    "value": {
                      "error": {
                        "code": "upstream_error",
                        "type": "invalid_request_error",
                        "message": "Decision service could not complete the request."
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized \u2014 missing or invalid API key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError401"
                },
                "example": {
                  "error": {
                    "message": "Incorrect API key provided",
                    "type": "authentication_error",
                    "param": null,
                    "code": "invalid_api_key"
                  }
                }
              }
            }
          },
          "402": {
            "description": "Payment Required \u2014 billing inactive or quota exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError402"
                },
                "example": {
                  "error": {
                    "code": "account_error",
                    "type": "invalid_request_error",
                    "message": "Account access is unavailable."
                  }
                }
              }
            }
          },
          "404": {
            "description": "Not Found \u2014 model not available for this account.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError404"
                },
                "example": {
                  "error": {
                    "code": "model_not_found",
                    "type": "invalid_request_error",
                    "message": "Decision model not found."
                  }
                }
              }
            }
          },
          "429": {
            "description": "Too Many Requests \u2014 rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError429"
                },
                "example": {
                  "error": {
                    "code": "rate_limit_exceeded",
                    "type": "rate_limit_error",
                    "message": "Request or spending limit exceeded."
                  }
                }
              }
            }
          },
          "500": {
            "description": "Internal Server Error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DecisionError500"
                },
                "example": {
                  "error": {
                    "message": "Internal server error",
                    "type": "server_error",
                    "param": null,
                    "code": "server_error"
                  }
                }
              }
            }
          },
          "413": {
            "description": "Payload Too Large \u2014 decision request body exceeds the size limit.",
