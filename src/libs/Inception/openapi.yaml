              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "tags": [
          "Decisions"
        ],
        "description": "Evaluate named questions against a shared state with Mercury Decide. Supports binary probability (`noul`), categorical choice, and ordinal score questions. Returns answers and token usage. Streaming is not supported.\n\nImages: put chat-style parts such as `{\"type\": \"image_url\", \"image_url\": {\"url\": \"data:image/png;base64,...\"}}` anywhere in `state` or a question's `instructions` (not in `criteria`). Images must be base64 PNG, JPEG, WebP, or GIF data URLs (remote URLs are not supported), at most 10 MiB each and 16 per upstream request. The complete JSON request, including base64 encoding, is also subject to the gateway's whole-request body limit (20 MiB by default).",
        "x-codeSamples": [
          {
            "lang": "bash",
            "label": "cURL",
            "source": "curl https://api.inceptionlabs.ai/v1/decisions -H \"Authorization: Bearer $INCEPTION_API_KEY\" -H \"Content-Type: application/json\" -d '{\n  \"model\": \"mercury-decide\",\n  \"state\": {\n    \"message\": \"Please refund the duplicate charge on my account.\"\n  },\n  \"questions\": {\n    \"billing\": {\n      \"type\": \"noul\",\n      \"instructions\": \"Is this request about billing?\"\n    },\n    \"team\": {\n      \"type\": \"choice\",\n      \"criteria\": {\n        \"billing\": \"Payments, charges, and refunds\",\n        \"support\": \"Technical support and other requests\"\n      }\n    },\n    \"urgency\": {\n      \"type\": \"score\",\n      \"instructions\": \"How urgent is this request?\",\n      \"criteria\": [\n        \"Can wait\",\n        \"Needs attention soon\",\n        \"Needs immediate attention\"\n      ]\n    }\n  }\n}'\n"
          },
          {
            "lang": "python",
            "label": "Python",
            "source": "import json\nimport os\nimport urllib.request\n\npayload = {\n    \"model\": \"mercury-decide\",\n    \"state\": {\n        \"message\": \"Please refund the duplicate charge on my account.\"\n    },\n    \"questions\": {\n        \"billing\": {\n            \"type\": \"noul\",\n            \"instructions\": \"Is this request about billing?\"\n        },\n        \"team\": {\n            \"type\": \"choice\",\n            \"criteria\": {\n                \"billing\": \"Payments, charges, and refunds\",\n                \"support\": \"Technical support and other requests\"\n            }\n        },\n        \"urgency\": {\n            \"type\": \"score\",\n            \"instructions\": \"How urgent is this request?\",\n            \"criteria\": [\n                \"Can wait\",\n                \"Needs attention soon\",\n                \"Needs immediate attention\"\n            ]\n        }\n    }\n}\nrequest = urllib.request.Request('https://api.inceptionlabs.ai/v1/decisions',\n    data=json.dumps(payload).encode(),\n    headers={\"Authorization\": f\"Bearer {os.environ['INCEPTION_API_KEY']}\",\n             \"Content-Type\": \"application/json\"}, method=\"POST\")\nwith urllib.request.urlopen(request, timeout=60) as response:\n    print(json.load(response)[\"answers\"])\n"
          },
          {
            "lang": "typescript",
            "label": "TypeScript",
            "source": "const response = await fetch('https://api.inceptionlabs.ai/v1/decisions', {\n  method: 'POST',\n  headers: {\n    Authorization: `Bearer ${process.env.INCEPTION_API_KEY}`,\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify({\n  \"model\": \"mercury-decide\",\n  \"state\": {\n    \"message\": \"Please refund the duplicate charge on my account.\"\n  },\n  \"questions\": {\n    \"billing\": {\n      \"type\": \"noul\",\n      \"instructions\": \"Is this request about billing?\"\n    },\n    \"team\": {\n      \"type\": \"choice\",\n      \"criteria\": {\n        \"billing\": \"Payments, charges, and refunds\",\n        \"support\": \"Technical support and other requests\"\n      }\n    },\n    \"urgency\": {\n      \"type\": \"score\",\n      \"instructions\": \"How urgent is this request?\",\n      \"criteria\": [\n        \"Can wait\",\n        \"Needs attention soon\",\n        \"Needs immediate attention\"\n      ]\n    }\n  }\n}),\n});\nif (!response.ok) throw new Error(await response.text());\nconsole.log((await response.json()).answers);\n"
          }
        ]
      }
    },
    "/v1/chat/completions": {
      "post": {
        "summary": "Create a chat completion",
        "operationId": "createChatCompletion",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ChatCompletionRequest"
              },
              "example": {
                "model": "mercury-2.5",
                "messages": [
                  {
                    "role": "user",
                    "content": "What is a diffusion language model?"
                  }
                ],
                "max_tokens": 256,
                "temperature": 0.75
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful response. Returns a JSON object when `stream=false`, or a server-sent events stream of `ChatCompletionChunk` objects (terminated by `data: [DONE]`) when `stream=true`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChatCompletionResponse"
                },
                "example": {
                  "id": "chatcmpl-7a2b3c4d5e",
                  "object": "chat.completion",
                  "created": 1745798400,
                  "model": "mercury-2.5",
                  "choices": [
                    {
                      "index": 0,
                      "finish_reason": "stop",
                      "message": {
                        "role": "assistant",
                        "content": "A diffusion language model is a type of language model that uses diffusion to generate text."
