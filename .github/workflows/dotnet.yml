name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v**

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    needs: native-aot
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      project-path: src/libs/Inception/Inception.csproj
      auto-stable-release: true
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'
    secrets:
      nuget-key: ${{ secrets.NUGET_KEY }}
      api-key: ${{ secrets.INCEPTION_API_KEY }}

  native-aot:
    name: NativeAOT smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish native executable
        run: dotnet publish src/tests/NativeAotSmoke/NativeAotSmoke.csproj -c Release -r linux-x64 --self-contained true -o /tmp/inception-native-aot
      - name: Run native protocol fixtures
        run: /tmp/inception-native-aot/NativeAotSmoke
